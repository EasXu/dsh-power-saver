name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Syntax and engine tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js

      - name: Engine tests
        run: npm test
